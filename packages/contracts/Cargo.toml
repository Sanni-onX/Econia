[workspace]
members = ["eco", "world", "native-world", "professional-world"]
resolver = "2"

[workspace.dependencies]
near-sdk = { version = "=5.24.1", features = ["legacy"] }
near-contract-standards = "=5.24.1"
near-sys = "=0.2.7"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
panic = "abort"
overflow-checks = true
