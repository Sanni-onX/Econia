name: Econia checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  production-container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t econia-services .
      - run: docker run --rm --mount type=volume,destination=/app/.data econia-services node scripts/smoke-container.mjs
  application:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: econia_test
          POSTGRES_USER: econia
          POSTGRES_PASSWORD: ci_only
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U econia" --health-interval 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://econia:ci_only@localhost:5432/econia_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check:secrets
      - run: npm test
      - run: npm run build
      - run: npm run test:soak
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.1
          targets: wasm32-unknown-unknown
      - run: cargo test --manifest-path packages/contracts/Cargo.toml --locked
      - run: cargo build --manifest-path packages/contracts/Cargo.toml --release --target wasm32-unknown-unknown --locked
